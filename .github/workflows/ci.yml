name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: agentanycast/agentanycast-proto
          path: agentanycast-proto

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure local replace directive
        run: go mod edit -replace github.com/agentanycast/agentanycast-proto=./agentanycast-proto

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: agentanycast/agentanycast-proto
          path: agentanycast-proto

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure local replace directive
        run: go mod edit -replace github.com/agentanycast/agentanycast-proto=./agentanycast-proto

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  build:
    name: Build Binary (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: agentanycast/agentanycast-proto
          path: agentanycast-proto

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure local replace directive
        run: go mod edit -replace github.com/agentanycast/agentanycast-proto=./agentanycast-proto

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o agentanycastd-linux-amd64 ./cmd/agentanycastd
