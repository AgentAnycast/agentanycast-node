name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: agentanycast/agentanycast-proto
          path: agentanycast-proto

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure local replace directive
        run: go mod edit -replace github.com/agentanycast/agentanycast-proto=./agentanycast-proto

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o agentanycastd-${{ matrix.os }}-${{ matrix.arch }} ./cmd/agentanycastd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentanycastd-${{ matrix.os }}-${{ matrix.arch }}
          path: agentanycastd-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum agentanycastd-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/agentanycastd-*
            artifacts/checksums.txt
